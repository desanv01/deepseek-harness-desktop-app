name: Publish the plugin

# The updates UI reaches a home one of two ways: inside the app's executable,
# which is the default and needs nothing from anyone, or from npm like any other
# DSH plugin. This is the second one.
#
# It is manual because a published version is permanent. Bump the version in
# plugins/dsh-plugin-desktop-updates/package.json, merge that, then run this with
# the same version - a mismatch fails instead of publishing something the
# source does not say.
#
# Two ways to authenticate, and the choice matters for the first publish. A
# trusted publisher is configured on a package's own settings page, so it cannot
# exist before the package does: the first version needs a token, and every
# version after it can use OIDC with no secret at all.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match the plugin manifest)'
        required: true
      dry_run:
        description: 'Pack and report the tarball without publishing it'
        type: boolean
        default: false
      method:
        description: 'How to authenticate with the registry'
        type: choice
        default: token-with-bypass-2fa
        options:
          - token-with-bypass-2fa
          - trusted-publishing-oidc

permissions:
  contents: read
  # Trusted publishing: the runner proves which workflow it is to npm with an
  # OIDC token, so no shared secret exists to leak or rotate.
  id-token: write

jobs:
  publish:
    name: Publish dsh-plugin-desktop-updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the version against the plugin manifest
        run: |
          manifest=$(node -p "require('./plugins/dsh-plugin-desktop-updates/package.json').version")
          echo "manifest: $manifest, requested: ${{ inputs.version }}"
          if [ "$manifest" != "${{ inputs.version }}" ]; then
            echo "::error::the plugin manifest says $manifest, not ${{ inputs.version }}"
            exit 1
          fi
          # Only a real publish is blocked by a version that already exists: a
          # dry run packs the same tree, and is how the pipeline is checked
          # before anything reaches the registry.
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            if npm view "dsh-plugin-desktop-updates@${{ inputs.version }}" version >/dev/null 2>&1; then
              echo "::error::dsh-plugin-desktop-updates@${{ inputs.version }} is already published"
              exit 1
            fi
          fi

      # The repository copy is private and carries the app's own files; the
      # tarball is staged from it so the two distributions cannot drift.
      - name: Stage the package
        run: node tools/stage-plugin-package.mjs plugins/dsh-plugin-desktop-updates plugin-out

      - name: Pack
        working-directory: plugin-out
        run: npm pack

      - name: Publish with a token
        if: ${{ !inputs.dry_run && inputs.method == 'token-with-bypass-2fa' }}
        working-directory: plugin-out
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A granular token with "Bypass 2FA" enabled, account-wide for the
          # first publish and scoped to the package afterwards: npm refuses a
          # publish that has neither a one-time password nor such a token.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::no NPM_TOKEN secret: create a granular token with bypass 2FA, or publish with trusted publishing"
            exit 1
          fi
          npm publish --access public

      - name: Publish with trusted publishing
        if: ${{ !inputs.dry_run && inputs.method == 'trusted-publishing-oidc' }}
        working-directory: plugin-out
        run: |
          # Trusted publishing needs npm 11.5.1 or later, which the runner's
          # bundled npm may predate. No NODE_AUTH_TOKEN is set here on purpose:
          # the npm CLI detects the OIDC environment and exchanges the runner's
          # identity for a short-lived credential.
          npm install -g npm@latest
          npm --version
          npm publish --access public
