name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Release, win-x64)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DeepSeekHarness/DeepSeekHarness.csproj -r win-x64

      - name: Build
        run: >
          dotnet build src/DeepSeekHarness/DeepSeekHarness.csproj
          -c Release -r win-x64 --no-restore

      - name: Check the version scheme
        shell: pwsh
        run: |
          # The release tag is v<Version>, and the updater compares them as
          # dates, so <Version> has to be a yyyy.MM.dd date.
          $xml = Get-Content src/DeepSeekHarness/DeepSeekHarness.csproj -Raw
          $match = [regex]::Match($xml, '<Version>([^<]+)</Version>')
          if (-not $match.Success) { throw 'the project file has no <Version>' }
          $version = $match.Groups[1].Value
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}$') {
            throw "<Version>$version</Version> is not a yyyy.MM.dd release date"
          }
          Write-Host "version $version looks right"

      - name: Smoke test the command line
        shell: pwsh
        run: |
          # The published app, not the build output: this is what users run.
          dotnet publish src/DeepSeekHarness/DeepSeekHarness.csproj -c Release -r win-x64 `
            --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o dist --no-restore
          if ($LASTEXITCODE -ne 0) { throw "publish failed with $LASTEXITCODE" }

          $env:DSH_DESKTOP_HOME = Join-Path $env:RUNNER_TEMP 'dsh-desktop-ci'
          $exe = Join-Path (Get-Location) 'dist/DeepSeekHarness.exe'

          # This is a GUI-subsystem executable: calling it with & does not
          # reliably wait for it, so every check goes through Start-Process.
          function Invoke-App {
            param([string[]]$AppArguments)
            $process = Start-Process -FilePath $exe -ArgumentList $AppArguments -Wait -PassThru
            return $process.ExitCode
          }

          $code = Invoke-App @('--self-test')
          if ($code -ne 0) { throw "--self-test failed with $code" }

          # Invalid arguments must be rejected with the documented exit code.
          $code = Invoke-App @('--port', '99999')
          if ($code -ne 2) { throw "an out-of-range --port should exit 2, got $code" }

          $code = Invoke-App @('--no-such-flag')
          if ($code -ne 2) { throw "an unknown flag should exit 2, got $code" }

          Write-Host 'command line behaved as documented'

      - name: Install the harness CLI for the plugin scenarios
        shell: pwsh
        run: |
          # The plugin scenarios need a real harness CLI to initialize profiles.
          # A runner that cannot install it skips those scenarios instead of
          # failing: they are covered locally, and this step is an upgrade.
          #
          # The release channel rather than a pinned version, because a pinned
          # prerelease resolves its own dependencies by range: 0.1.5-rc.1 now
          # installs a tree whose plugin rows cannot be resolved, which is a
          # broken harness rather than a broken app. The suite probes whether the
          # CLI can boot a server and skips the scenarios that need one.
          npm install -g @deepseek-ai/dsh@latest --no-audit --no-fund --loglevel=error
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::the harness CLI could not be installed; the plugin scenarios will skip'
          }
          dsh --version
          exit 0

      - name: Smoke test the harness CLI handling
        shell: pwsh
        run: |
          # Fixtures, not this machine: a fake npm prefix and a fake npm that can
          # succeed, fail, or leave a half-installed package behind.
          $work = Join-Path $env:RUNNER_TEMP 'dsh-smoke'
          ./tools/smoke-test.ps1 -Exe ./dist/DeepSeekHarness.exe -WorkRoot $work

      - name: Upload the smoke test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: |
            ${{ runner.temp }}/dsh-smoke/*.txt
          if-no-files-found: ignore
